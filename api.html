<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

        <style>
            body{
                font-family:'Times New Roman', Times, serif;
                background-color: #2a223e;
                text-align: center;
            }

            table{
                width: 90%;
                margin: 10px auto;
                border-collapse: collapse;
                background-color: white;
            }

            th, td{
                border: 1px solid black;
                padding: 10px;
                text-align: center;
            }

            th{
                background-color: #206622;
                color: rgb(56, 163, 32);
            }

            tr:nth-child(even){
                background-color: #155766;
            }
        </style>
</head>
<body>

    <h2 style="color:red" >Student Records</h2>

    <table id="studentTable">
        <thead>
            <tr>
                <th>id</th>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Website</th>
                <th>Street</th>
                <th style="padding:30px" >Suite</th>
                <th>City</th>
                <th style="padding: 30px;" >Zipcode</th>
                <th>Lat</th>
                <th>Lng</th>
            </tr>
        </thead>

        <tbody>

        </tbody>
    </table>

<script>

async function loadStudents(){

    const response = await fetch("https://jsonplaceholder.typicode.com/users");

    const students = await response.json();

    const tbody = document.querySelector("#studentTable tbody");

    students.forEach(student => {

        tbody.innerHTML += `
            <tr>
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.username}</td>
                <td>${student.email}</td>
                <td>${student.phone}</td>
                <td>${student.website}</td>
                <td>${student.address.street}</td>
                <td>${student.address.suite}</td>
                <td>${student.address.city}</td>
                <td>${student.address.zipcode}</td>
                <td>${student.address.geo.lat}</td>
                <td>${student.address.geo.lng}</td>
            </tr>
        `;

    });

}

loadStudents();

</script>

</body>
</html>
